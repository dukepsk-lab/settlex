[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settlex"
version = "0.1.0"
description = "SET50 ML trading-signal engine (CNN-BiLSTM + XGBoost ensemble) with Telegram delivery"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "tensorflow-cpu>=2.16",
    "PyPortfolioOpt>=1.5",
    "python-dotenv>=1.0",
    "pyarrow>=12.0",
    "requests>=2.28",
    "yfinance>=0.2.40",
    "settrade-v2>=2.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
stationarity = ["statsmodels>=0.14"]
# Optional LLM providers for the `briefing` command (each is independent).
llm = ["anthropic>=0.40", "google-genai>=0.3", "openai>=1.40"]

[project.scripts]
settlex = "settlex.cli:main"

[tool.setuptools.packages.find]
include = ["settlex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
